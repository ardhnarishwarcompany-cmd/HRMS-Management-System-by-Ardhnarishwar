# Ardhnarishwar HRMS — VPS production Nginx routing
# Backend + 10 public portal hosts. Run certbot after DNS A records resolve.
# Internal services remain on 127.0.0.1; browser-facing URLs are HTTPS live domains.

server {
    listen 80;
    server_name ardhnarishwar-hrms-backend.recruweb.com;
    client_max_body_size 600m;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name ardhnarishwar-admin.hrms.recruweb.com;
    root /var/www/ardhnarishwar-hrms/admin/dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
