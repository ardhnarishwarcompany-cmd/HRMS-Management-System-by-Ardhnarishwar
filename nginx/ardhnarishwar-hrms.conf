# 9) HR Robotics / AI Interview dedicated public portal.
# UI is the included React build; API calls go directly to the unified backend URL.
server {
    listen 80;
    server_name ardhnarishwar-ai.hr-robo.recruweb.com;
    root /var/www/ardhnarishwar-hrms/AI-Robotics-Frontend/dist;
    index index.html;
    client_max_body_size 600m;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 10) Smart Attendance dedicated public portal.
# The existing Node module remains the single source of truth and database;
# this host is only a public-domain front door to /api/smart-attendance/*.
server {
    listen 80;
    server_name ardhnarishwar-smart-attendance.recruweb.com;
    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:5000/api/smart-attendance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 86400;
    }
}
