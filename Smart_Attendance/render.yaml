services:
  - type: web
    name: global-attendance-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLATFORM_NAME
        value: Global Attendance Management System
      - key: SUPER_ADMIN_COMPANY
        value: Global Attendance Enterprise
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@ardhnarishwar.com
      - key: SUPER_ADMIN_PASS
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        value: smart_attendance
      # Set MONGO_URI from your free MongoDB Atlas cluster:
      - key: MONGO_URI
        sync: false
