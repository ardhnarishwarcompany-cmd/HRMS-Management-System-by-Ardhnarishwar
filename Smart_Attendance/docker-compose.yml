version: '3.8'

services:
  web:
    build: .
    container_name: global_attendance_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/
      - DATABASE_NAME=smart_attendance
      - SECRET_KEY=enterprise_production_secret_key_2026_gams
      - PLATFORM_NAME=Global Attendance Management System
      - SUPER_ADMIN_EMAIL=superadmin@ardhnarishwar.com
      - SUPER_ADMIN_PASS=superadmin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - attendance_net

  mongo:
    image: mongo:7.0
    container_name: global_attendance_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_net

volumes:
  mongodb_data:
    driver: local

networks:
  attendance_net:
    driver: bridge
