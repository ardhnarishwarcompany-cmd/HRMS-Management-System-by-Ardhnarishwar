<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Wi-Fi Clock-In • Global Attendance Management System</title>
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
.clockin-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  position: relative;
  z-index: 1;
}

.clockin-card {
  width: 100%;
  max-width: 460px;
  background: var(--bg-card);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-xl);
  padding: 34px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.clockin-header {
  text-align: center;
}

.clockin-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin-bottom: 12px;
  box-shadow: 0 0 24px var(--glow-cyan);
}

.clockin-header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 4px;
}

.clockin-header p {
  font-size: 13.5px;
  color: var(--text-secondary);
}

.network-gauge {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.gauge-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.emp-badge-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="clockin-container">
  <div class="clockin-card">
    <div class="clockin-header">
      <div class="clockin-icon">📶</div>
      <h1>Corporate Wi-Fi Clock-In</h1>
      <p>Authorized corporate office network verification</p>
    </div>

    <div class="emp-badge-bar">
      <div>
        <strong id="emp-name" style="color:var(--text-primary);">Employee</strong>
        <span style="font-family:var(--font-mono); color:var(--cyan); margin-left:6px;" id="emp-id">(EMP)</span>
      </div>
      <div class="badge badge-cyan">
        <span class="badge-dot"></span> <span id="comp-id">COMPANY</span>
      </div>
    </div>

    <div class="network-gauge">
      <div class="gauge-row">
        <span style="color:var(--text-muted);">Device IP Address:</span>
        <span style="font-family:var(--font-mono); color:var(--cyan);" id="client-ip">Inspecting...</span>
      </div>
      <div class="gauge-row">
        <span style="color:var(--text-muted);">Network Subnet:</span>
        <span style="font-family:var(--font-mono); color:var(--text-primary);" id="client-subnet">Inspecting...</span>
      </div>
      <div class="gauge-row" style="margin-top:6px; border-top:1px solid var(--border-subtle); padding-top:10px;">
        <span style="color:var(--text-muted);">Office Network Status:</span>
        <span class="badge badge-emerald" id="net-status-badge">
          <span class="badge-dot"></span> Verified Subnet
        </span>
      </div>
    </div>

    <button class="btn btn-primary btn-lg" id="btn-clockin" onclick="markWifiAttendance()">
      Record Wi-Fi Attendance →
    </button>

    <a href="/employee" style="text-align:center; color:var(--text-muted); font-size:13px; text-decoration:none; margin-top:4px;">
      ← Return to Employee Dashboard
    </a>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
let currentCompanyId = "";
let currentEmpId = "";

async function initPage() {
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.ok && data.user) {
      currentCompanyId = data.user.company_id || "";
      currentEmpId = data.user.emp_id || "";
      document.getElementById('emp-name').textContent = data.user.name;
      document.getElementById('emp-id').textContent = `(${currentEmpId})`;
      document.getElementById('comp-id').textContent = currentCompanyId;
    }
  } catch (err) {}

  await checkNetwork();
}

async function checkNetwork() {
  try {
    const res = await fetch(`/api/network-status?company_id=${currentCompanyId}`);
    const data = await res.json();
    const ip = data.client_ip || '127.0.0.1';
    document.getElementById('client-ip').textContent = ip;
    document.getElementById('client-subnet').textContent = ip.split('.').slice(0, 3).join('.') + '.*';

    const badge = document.getElementById('net-status-badge');
    if (data.on_office_wifi) {
      badge.className = 'badge badge-emerald';
      badge.innerHTML = '<span class="badge-dot"></span> Authorized Office Network';
    } else {
      badge.className = 'badge badge-rose';
      badge.innerHTML = '<span class="badge-dot"></span> External Network Subnet';
    }
  } catch (err) {
    console.error('Network check error:', err);
  }
}

async function markWifiAttendance() {
  const btn = document.getElementById('btn-clockin');
  btn.textContent = 'Verifying Network...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/attendance/mark-wifi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_id: currentCompanyId, emp_id: currentEmpId })
    });
    const data = await res.json();

    if (data.ok) {
      showToast(data.message, 'success');
      btn.textContent = 'Attendance Recorded ✓';
      setTimeout(() => { window.location.href = '/employee'; }, 2000);
    } else {
      showToast(data.error || 'Wi-Fi clock-in failed', 'error');
      btn.disabled = false;
      btn.textContent = 'Record Wi-Fi Attendance →';
    }
  } catch (err) {
    showToast('Network communication failure', 'error');
    btn.disabled = false;
    btn.textContent = 'Record Wi-Fi Attendance →';
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> <div>${msg}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

window.onload = initPage;
</script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/telemetry.js"></script>
</body>
</html>
